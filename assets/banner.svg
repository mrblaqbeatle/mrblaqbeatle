<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
      .display { font-family: 'Space Grotesk', 'Segoe UI', sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
    </style>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0F"/>
      <stop offset="55%" stop-color="#120E1D"/>
      <stop offset="100%" stop-color="#0A0A0F"/>
    </linearGradient>

    <radialGradient id="ghostGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9D4EDD" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9D4EDD" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="hairline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9D4EDD" stop-opacity="0"/>
      <stop offset="50%" stop-color="#9D4EDD" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#9D4EDD" stop-opacity="0"/>
    </linearGradient>

    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8A8699" opacity="0.22"/>
    </pattern>

    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- base -->
  <rect width="1200" height="320" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" fill="url(#dotGrid)"/>
  <circle cx="900" cy="160" r="190" fill="url(#ghostGlow)" filter="url(#softBlur)"/>

  <!-- left: identity block -->
  <text x="70" y="98" class="mono" fill="#C77DFF" font-size="14" letter-spacing="5">PHANTOM ILLUSIONS STUDIO</text>
  <text x="66" y="178" class="display" fill="#EDEAF6" font-size="76" font-weight="700">EZRA</text>
  <text x="70" y="212" class="mono" fill="#B7B2C6" font-size="16">Software Developer — Backend Engineer</text>
  <text x="70" y="236" class="mono" fill="#8A8699" font-size="15">Co-Founder, Phantom Illusions Studio · Uganda</text>

  <!-- vertical separator -->
  <line x1="560" y1="70" x2="560" y2="250" stroke="#2A2438" stroke-width="1.5"/>

  <!-- right: phantom / circuit signature -->
  <g transform="translate(700,30)">
    <!-- outward circuit traces -->
    <path d="M270,60 L340,30" stroke="#9D4EDD" stroke-width="1.2" stroke-dasharray="3 5" opacity="0.8">
      <animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <circle cx="340" cy="30" r="3" fill="#0A0A0F" stroke="#C77DFF" stroke-width="1.4"/>

    <path d="M280,130 L360,150" stroke="#9D4EDD" stroke-width="1.2" stroke-dasharray="3 5" opacity="0.8">
      <animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <circle cx="360" cy="150" r="3" fill="#0A0A0F" stroke="#C77DFF" stroke-width="1.4"/>

    <path d="M30,110 L-40,95" stroke="#9D4EDD" stroke-width="1.2" stroke-dasharray="3 5" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="0" to="-16" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <circle cx="-40" cy="95" r="3" fill="#0A0A0F" stroke="#C77DFF" stroke-width="1.4"/>

    <!-- ghost silhouette -->
    <path d="M20,90 A90,90 0 0 1 200,90 L200,200 Q177.5,225 155,200 Q132.5,225 110,200 Q87.5,225 65,200 Q42.5,225 20,200 Z"
          fill="rgba(157,78,221,0.07)" stroke="#C77DFF" stroke-width="2" filter="url(#softBlur)" opacity="0.85"/>
    <path d="M20,90 A90,90 0 0 1 200,90 L200,200 Q177.5,225 155,200 Q132.5,225 110,200 Q87.5,225 65,200 Q42.5,225 20,200 Z"
          fill="none" stroke="#C77DFF" stroke-width="1.5"/>

    <!-- eyes -->
    <circle cx="75" cy="95" r="6" fill="#0A0A0F" stroke="#C77DFF" stroke-width="1.5"/>
    <circle cx="145" cy="95" r="6" fill="#0A0A0F" stroke="#C77DFF" stroke-width="1.5"/>

    <!-- pulsing circuit nodes along the outline -->
    <circle cx="20" cy="90" r="2.6" fill="#C77DFF">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="90" r="2.6" fill="#C77DFF">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="110" cy="15" r="2.6" fill="#C77DFF">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="200" r="2.6" fill="#C77DFF">
      <animate attributeName="opacity" values="1;0.35;1" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="200" r="2.6" fill="#C77DFF">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="3.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- bottom hairline + footer label -->
  <line x1="70" y1="288" x2="1130" y2="288" stroke="url(#hairline)" stroke-width="1"/>
  <text x="70" y="310" class="mono" fill="#605B70" font-size="12" letter-spacing="3">KAMPALA, UG · SYSTEMS &amp; SOFTWARE</text>
</svg>
